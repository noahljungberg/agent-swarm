interface:
  display_name: "Agent Swarm"
  short_description: "Hand tasks to persistent Codex/Claude worker agents"
  default_prompt: "Use $agent-swarm. Act as the orchestrator: split the task into bounded worker prompts, hand them to workers with agent-swarm run where useful, wait for them, review and commit their work, and report running/completed/blocked agents plus required user action."
